    <!-- Initialize News List -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const parameters = new URLSearchParams(window.location.search);
            const lang = parameters.get('lang') || 'tw';
            document.querySelectorAll('.select_lang').forEach(function (el) { el.value = lang; });
            document.querySelectorAll('.logo,.goto-home,.goto-01,.goto-02,.goto-03,.goto-04,.goto-05').forEach(function (el) { el.setAttribute('href', 'index.html?lang=' + lang); });
            document.querySelectorAll('.goto-06').forEach(function (el) { el.setAttribute('href', 'corporate_governance.html?lang=' + lang); });
            document.querySelectorAll('.goto-07').forEach(function (el) { el.setAttribute('href', 'corporate-sustainability.html?lang=' + lang); });
            document.querySelectorAll('.back_link').forEach(function (el) { el.setAttribute('href', 'index.html?lang=' + lang); });

            var container = document.getElementById('container');
            if (lang === 'en') {
                if (container) container.classList.add('for-en');
            } else {
                if (container) container.classList.remove('for-en');
            }

            const datas = getLocalStorage(lang);
            setDalueData(datas, lang);

            // 渲染新聞列表
            renderNewsList(datas, lang);
        });

        function renderNewsList(data, lang) {
            if (!data || !data.news || data.news.length === 0) {
                return;
            }

            // 複製新聞陣列並按日期排序 (最新的在前)
            const sortedNews = [...data.news].sort(function (a, b) {
                // 從日期字串中提取日期部分 (例如: "發佈日期：2024/09/24" -> "2024/09/24")
                const dateA = a.date.split('：')[1] || a.date.split(': ')[1];
                const dateB = b.date.split('：')[1] || b.date.split(': ')[1];

                // 轉換為 Date 對象進行比較
                return new Date(dateB) - new Date(dateA);
            });

            // 生成 HTML
            let newsHtml = '';
            sortedNews.forEach(function (news) {
                newsHtml += `
                    <div class="news-item">
                        <div class="news-item-img">
                            <img src="${news.img}" alt="${news.title}">
                        </div>
                        <div class="news-item-content">
                            <div class="news-item-date">${news.date}</div>
                            <div class="news-item-title">${news.title}</div>
                            <a href="news.html?lang=${lang}&id=${news.id}&from=list" class="news-detail-btn">${lang === 'en' ? 'View Details' : '查看詳情'}</a>
                        </div>
                    </div>
                `;
            });

            // 插入到容器中
            const newsContainer = document.getElementById('news_list_container');
            if (newsContainer) {
                newsContainer.innerHTML = newsHtml;
            }
        }
    </script>
